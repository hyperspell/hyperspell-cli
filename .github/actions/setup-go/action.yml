name: Setup Go
description: 'Sets up Go environment'
inputs:
  go-repo-deploy-key:
    required: false
    description: read-only SSH deploy key for a private Go SDK repository
  go-version:
    required: false
    description: version or version range of Go to use
  cache-dependency-path:
    required: false
    description: path to dependency files for caching
runs:
  using: composite
  steps:
    - name: Configure access to a private Go SDK module
      if: inputs.go-repo-deploy-key != ''
      shell: bash
      env:
        GO_MODULE_REPO: ${{ github.repository == 'hyperspell/hyperspell-cli-staging' && 'hyperspell/hyperspell-go-staging' || 'hyperspell/hyperspell-go' }}
        GO_REPO_DEPLOY_KEY: ${{ inputs.go-repo-deploy-key }}
      run: |
        ssh_dir="$RUNNER_TEMP/go-sdk-ssh"
        key_file="$ssh_dir/deploy-key"
        known_hosts_file="$ssh_dir/known-hosts"
        install -d -m 700 "$ssh_dir"
        printf '%s\n' "$GO_REPO_DEPLOY_KEY" > "$key_file"
        chmod 600 "$key_file"
        ssh-keyscan -H github.com > "$known_hosts_file"
        git config --global core.sshCommand "ssh -i $key_file -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts_file"
        git config --global url."git@github.com:${GO_MODULE_REPO}".insteadOf "https://github.com/${GO_MODULE_REPO}"

    - name: Verify Go SDK module is accessible
      shell: bash
      env:
        GO_MODULE_REPO: ${{ github.repository == 'hyperspell/hyperspell-cli-staging' && 'hyperspell/hyperspell-go-staging' || 'hyperspell/hyperspell-go' }}
      run: |
        if ! git ls-remote --exit-code "https://github.com/${GO_MODULE_REPO}" >/dev/null 2>&1; then
          echo "::error::Cannot access the Go SDK module at https://github.com/${GO_MODULE_REPO}."
          echo "::error::If the repo is private, add a read-only deploy key as the GO_REPO_DEPLOY_KEY Actions secret."
          exit 1
        fi

    - name: Setup go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ./go.mod
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Bootstrap
      shell: bash
      run: ./scripts/bootstrap