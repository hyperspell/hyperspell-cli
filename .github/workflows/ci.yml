name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

env:
  GOPRIVATE: github.com/hyperspell/hyperspell-go,github.com/hyperspell/hyperspell-go-staging

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # If the selected Go SDK repo is private, store a read-only deploy key in
      # the `GO_REPO_DEPLOY_KEY` Actions secret. The setup action configures
      # that key before checking or downloading the module (${{ github.repository == 'hyperspell/hyperspell-cli-staging' && 'hyperspell/hyperspell-go-staging' || 'hyperspell/hyperspell-go' }}).
      - uses: ./.github/actions/setup-go
        with:
          go-repo-deploy-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.GO_REPO_DEPLOY_KEY || '' }}

      - name: Link staging branch
        if: github.repository == 'hyperspell/hyperspell-cli-staging'
        run: |
          ./scripts/link 'github.com/hyperspell/hyperspell-go-staging@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  build:
    timeout-minutes: 10
    name: build
    permissions:
      contents: read

    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # If the selected Go SDK repo is private, store a read-only deploy key in
      # the `GO_REPO_DEPLOY_KEY` Actions secret. The setup action configures
      # that key before checking or downloading the module (${{ github.repository == 'hyperspell/hyperspell-cli-staging' && 'hyperspell/hyperspell-go-staging' || 'hyperspell/hyperspell-go' }}).
      - uses: ./.github/actions/setup-go
        with:
          go-repo-deploy-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.GO_REPO_DEPLOY_KEY || '' }}

      - name: Link staging branch
        if: github.repository == 'hyperspell/hyperspell-cli-staging'
        run: |
          ./scripts/link 'github.com/hyperspell/hyperspell-go-staging@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}





  test:
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # If the selected Go SDK repo is private, store a read-only deploy key in
      # the `GO_REPO_DEPLOY_KEY` Actions secret. The setup action configures
      # that key before checking or downloading the module (${{ github.repository == 'hyperspell/hyperspell-cli-staging' && 'hyperspell/hyperspell-go-staging' || 'hyperspell/hyperspell-go' }}).
      - uses: ./.github/actions/setup-go
        with:
          go-repo-deploy-key: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.GO_REPO_DEPLOY_KEY || '' }}

      - name: Link staging branch
        if: github.repository == 'hyperspell/hyperspell-cli-staging'
        run: |
          ./scripts/link 'github.com/hyperspell/hyperspell-go-staging@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
